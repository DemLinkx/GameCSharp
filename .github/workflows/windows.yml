name: Windows build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish for Windows x64
        run: dotnet publish src/GameCSharp.WinForms -c Release -r win-x64 --self-contained -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: GameCSharp-win-x64
          path: publish/
          if-no-files-found: error
